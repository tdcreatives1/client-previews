<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @keyframes oas-dot { 0%,80%,100%{opacity:.25;transform:translateY(0)} 40%{opacity:1;transform:translateY(-3px)} }
    @keyframes oas-pop { from{opacity:0;transform:translateY(12px) scale(.98)} to{opacity:1;transform:translateY(0) scale(1)} }
  </style>
</helmet>
<div style="position:fixed;bottom:22px;left:22px;z-index:200;font-family:'Source Sans 3',system-ui,sans-serif">
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="width:378px;max-width:calc(100vw - 32px);height:560px;max-height:calc(100vh - 110px);background:#FFFDF7;border-radius:14px;box-shadow:0 24px 70px rgba(20,34,79,0.38);display:flex;flex-direction:column;overflow:hidden;margin-bottom:14px;animation:oas-pop .22s ease">
      <div style="background:#14224F;padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #C39A3E">
        <div style="width:38px;height:38px;border-radius:50%;background:#C39A3E;color:#14224F;display:flex;align-items:center;justify-content:center;font-family:Marcellus,serif;font-size:16px;flex-shrink:0">OA</div>
        <div style="flex:1;min-width:0">
          <div style="font-family:Marcellus,serif;font-size:16px;color:#FFFFFF">Outsourced Administrative Services</div>
          <div style="font-size:12.5px;color:#9AA5C0">Virtual assistant · typically replies in seconds</div>
        </div>
        <button onClick="{{ toggle }}" title="Minimize" style="border:none;background:none;color:#9AA5C0;font-size:20px;cursor:pointer;padding:2px 6px;line-height:1" style-hover="color:#FFFFFF">–</button>
      </div>
      <div ref="{{ scrollRef }}" style="flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;background:#F7F4EC">
        <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="1">
          <div style="display:flex;flex-direction:column;align-items:{{ m.align }}">
            <div style="max-width:85%;padding:10px 14px;border-radius:{{ m.radius }};background:{{ m.bg }};color:{{ m.color }};font-size:14.5px;line-height:1.5;white-space:pre-wrap">{{ m.text }}</div>
          </div>
        </sc-for>
        <sc-if value="{{ typing }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex">
            <div style="padding:12px 16px;border-radius:12px 12px 12px 4px;background:#FFFFFF;border:1px solid #E4DECD;display:flex;gap:5px;align-items:center">
              <span style="width:7px;height:7px;border-radius:50%;background:#14224F;animation:oas-dot 1.1s infinite"></span>
              <span style="width:7px;height:7px;border-radius:50%;background:#14224F;animation:oas-dot 1.1s .18s infinite"></span>
              <span style="width:7px;height:7px;border-radius:50%;background:#14224F;animation:oas-dot 1.1s .36s infinite"></span>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ hasButtons }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end">
            <sc-for list="{{ buttons }}" as="b" hint-placeholder-count="3">
              <button onClick="{{ b.pick }}" style="border:1px solid #C39A3E;background:#FFFFFF;color:#14224F;border-radius:20px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="background:#C39A3E">{{ b.label }}</button>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <div style="padding:12px 14px;background:#FFFDF7;border-top:1px solid #E4DECD;display:flex;gap:8px">
        <input ref="{{ inputRef }}" onKeyDown="{{ onKey }}" placeholder="Type your question…" disabled="{{ typing }}" style="flex:1;padding:11px 13px;border:1px solid #D8D2C2;border-radius:9px;font-size:14.5px;font-family:inherit;background:#FFFFFF;color:#22293B;min-width:0"/>
        <button onClick="{{ send }}" disabled="{{ typing }}" style="background:#14224F;color:#FFFFFF;border:none;border-radius:9px;padding:0 18px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="background:#1D3068">Send</button>
      </div>
    </div>
  </sc-if>
  <div style="display:flex;justify-content:flex-start">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:10px;background:#14224F;color:#FFFFFF;border:2px solid #C39A3E;border-radius:30px;padding:13px 22px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 10px 30px rgba(20,34,79,0.35);font-family:'Source Sans 3',system-ui,sans-serif" style-hover="background:#1D3068">
      <span style="width:9px;height:9px;border-radius:50%;background:#5FA871"></span>{{ launcherLabel }}
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open:false, msgs:[], buttons:[], typing:false, ready:false };
  inputRef=React.createRef(); scrollRef=React.createRef();
  async componentDidMount(){
    this.cfg = await import('./chatbot-config.js');
    let saved=null;
    try{ saved=JSON.parse(sessionStorage.getItem('oas-chat-v1')); }catch(e){}
    if(saved && Array.isArray(saved.msgs) && saved.msgs.length){
      this.setState({msgs:saved.msgs, buttons:saved.buttons||[], open:!!saved.open, ready:true});
    } else {
      this.setState({msgs:[{role:'assistant',text:this.cfg.MESSAGES.greeting}], buttons:this.cfg.MESSAGES.quickButtons, ready:true});
    }
  }
  persist(extra){
    const s={...this.state,...extra};
    try{ sessionStorage.setItem('oas-chat-v1', JSON.stringify({msgs:s.msgs, buttons:s.buttons, open:s.open})); }catch(e){}
  }
  scrollDown(){
    setTimeout(()=>{ const el=this.scrollRef.current; if(el) el.scrollTop=el.scrollHeight; },60);
  }
  focusInput(){
    setTimeout(()=>{ const el=this.inputRef.current; if(el && !el.disabled) el.focus(); },80);
  }
  saveLead(lead){
    const record={...lead, savedAt:new Date().toISOString(),
      transcript:this.state.msgs.map(m=>(m.role==='user'?'Visitor: ':'Assistant: ')+m.text).join('\n')};
    try{
      const all=JSON.parse(localStorage.getItem('oas-leads-v1')||'[]');
      all.push(record);
      localStorage.setItem('oas-leads-v1', JSON.stringify(all));
    }catch(e){}
    const lines=['NEW WEBSITE LEAD','',
      'Name: '+(lead.name||'—'),'Business: '+(lead.business||'—'),'Industry: '+(lead.industry||'—'),
      'Primary needs: '+(lead.primaryNeeds||'—'),'Current situation: '+(lead.currentSituation||'—'),
      'Support needed: '+(lead.supportType||'—'),'Estimated workload: '+(lead.workload||'—'),
      'Timeline: '+(lead.timeline||'—'),'Preferred contact: '+(lead.contactPref||'—'),
      'Phone: '+(lead.phone||'—'),'Email: '+(lead.email||'—'),
      'Additional notes: '+(lead.notes||'—'),'','Lead classification: '+(lead.classification||'Needs Review'),
      '','Conversation summary:',lead.conversationSummary||'—'].join('\n');
    // FormSubmit delivers to each inbox (first-ever submission per inbox triggers a one-time activation email)
    this.cfg.NOTIFY.emails.forEach(addr=>{
      fetch('https://formsubmit.co/ajax/'+addr,{method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({_subject:'New website lead: '+(lead.name||'Unknown')+(lead.business?' — '+lead.business:''),
          summary:lines,_template:'box'})}).catch(()=>{});
    });
    return 'Lead saved and notification email sent to Paula.';
  }
  async send(text){
    const msg=(text ?? this.inputRef.current?.value ?? '').trim();
    if(!msg || this.state.typing || !this.cfg) return;
    if(this.inputRef.current) this.inputRef.current.value='';
    const msgs=[...this.state.msgs,{role:'user',text:msg}];
    this.setState({msgs,buttons:[],typing:true},()=>this.persist({}));
    this.scrollDown();
    try{
      const apiMsgs=msgs.map(m=>({role:m.role,content:m.text}));
      const reply=await window.claude.complete({
        system:this.cfg.buildSystemPrompt(),
        messages:apiMsgs, max_tokens:600,
        tools:[{name:'save_lead',description:'Save a qualified lead and notify Paula by email. Call once, when contact info and context are collected.',
          input_schema:{type:'object',properties:{
            name:{type:'string'},business:{type:'string'},industry:{type:'string'},
            primaryNeeds:{type:'string'},currentSituation:{type:'string'},supportType:{type:'string'},
            workload:{type:'string'},timeline:{type:'string'},contactPref:{type:'string'},
            phone:{type:'string'},email:{type:'string'},notes:{type:'string'},
            classification:{type:'string',enum:['High Intent','Potential Fit','Needs Review','Low Intent / Researching']},
            conversationSummary:{type:'string'}},required:['conversationSummary','classification']},
          run:async(input)=>this.saveLead(input)}]
      });
      let textOut=String(reply||'').trim(); let buttons=[];
      const bm=textOut.match(/\[buttons:\s*([^\]]+)\]/i);
      if(bm){ buttons=bm[1].split('|').map(s=>s.trim()).filter(Boolean); textOut=textOut.replace(bm[0],'').trim(); }
      if(!textOut) textOut='…';
      this.setState({msgs:[...msgs,{role:'assistant',text:textOut}],buttons,typing:false},()=>this.persist({}));
    }catch(e){
      this.setState({msgs:[...msgs,{role:'assistant',text:'I ran into a connection problem. You can also reach Paula directly at paula@oas-llc.com or 661-747-7171.'}],typing:false},()=>this.persist({}));
    }
    this.scrollDown(); this.focusInput();
  }
  renderVals(){
    const s=this.state;
    return {
      open:s.open, typing:s.typing,
      launcherLabel:s.open?'Close chat':'Questions? Chat with us',
      toggle:()=>{ const opening=!s.open; this.setState({open:opening},()=>this.persist({})); this.scrollDown(); if(opening) this.focusInput(); },
      msgs:s.msgs.map(m=>({...m,
        align:m.role==='user'?'flex-end':'flex-start',
        bg:m.role==='user'?'#14224F':'#FFFFFF',
        color:m.role==='user'?'#FFFFFF':'#22293B',
        radius:m.role==='user'?'12px 12px 4px 12px':'12px 12px 12px 4px'})),
      hasButtons:s.buttons.length>0 && !s.typing,
      buttons:s.buttons.map(b=>({label:b,pick:()=>{ this.send(b); this.focusInput(); }})),
      send:()=>this.send(), onKey:(e)=>{ if(e.key==='Enter') this.send(); },
      inputRef:this.inputRef, scrollRef:this.scrollRef
    };
  }
}
</script>
</body>
</html>
