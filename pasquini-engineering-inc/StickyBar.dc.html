<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Open Sans',Helvetica,Arial,sans-serif}a{color:#2172b8;text-decoration:none}a:hover{color:#16324f}</style>
</helmet>
<sc-if value="{{ show }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;bottom:0;left:0;right:0;z-index:9998;display:flex;font-family:'Open Sans',Helvetica,Arial,sans-serif;box-shadow:0 -4px 16px rgba(22,50,79,0.25)">
    <a href="{{ telHref }}" style="flex:1;background:#ffc20e;color:#1a1a1a;text-align:center;padding:15px 8px;font-weight:700;font-size:15px" style-hover="background:#e8ae00;color:#1a1a1a">📞 Call Now</a>
    <a href="{{ smsHref }}" style="flex:1;background:#16324f;color:#ffffff;text-align:center;padding:15px 8px;font-weight:700;font-size:15px" style-hover="background:#0d1f32;color:#ffffff">💬 Text Us</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;420px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;8885099252&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this.mq = window.matchMedia("(max-width: 768px)");
    this.onChange = () => this.forceUpdate();
    this.mq.addEventListener("change", this.onChange);
  }
  componentWillUnmount() { this.mq.removeEventListener("change", this.onChange); }
  renderVals() {
    const phone = (this.props.phone ?? "8885099252").replace(/[^0-9]/g, "");
    return { show: this.mq ? this.mq.matches : false, telHref: "tel:" + phone, smsHref: "sms:" + phone };
  }
}
</script>
</body>
</html>
